name: Macro compatibility smoke

on:
  pull_request:
    paths:
      - 'avanza_macro_maestro_v4.user.js'
      - 'tests/maestro_smoke.test.cjs'
      - 'tests/auto-latch.test.mjs'
      - 'tests/canonical-id-undeterminable-main49.test.mjs'
      - 'tests/maestro_ui_smoke.mjs'
      - 'macro-registry.json'
      - '.github/workflows/macro-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'avanza_macro_maestro_v4.user.js'
      - 'tests/maestro_smoke.test.cjs'
      - 'tests/auto-latch.test.mjs'
      - 'tests/maestro_ui_smoke.mjs'
      - 'macro-registry.json'
      - '.github/workflows/macro-smoke.yml'

permissions:
  contents: read

concurrency:
  group: macro-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check avanza_macro_maestro_v4.user.js
      - name: Run offline non-network unit tests
        run: node --test tests/maestro_smoke.test.cjs tests/auto-latch.test.mjs tests/canonical-id-undeterminable-main49.test.mjs
      - name: Install small browser test harness
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Headless Chromium UI controls
        run: node tests/maestro_ui_smoke.mjs
