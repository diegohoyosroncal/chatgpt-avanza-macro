name: AVANZA macro compatibility
on:
  pull_request:
    paths:
      - 'avanza_macro_maestro_v4.user.js'
      - 'avanza_macro.user.js'
      - 'macro-registry.json'
      - 'tests/**'
      - '.github/workflows/macro-compatibility.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'avanza_macro_maestro_v4.user.js'
      - 'avanza_macro.user.js'
      - 'macro-registry.json'
      - 'tests/**'
      - '.github/workflows/macro-compatibility.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check avanza_macro_maestro_v4.user.js
      - name: Version and collision safety regression tests
        run: node --test tests/macro-compatibility.test.mjs
      - name: Prepare isolated Chromium UI smoke test
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Floating panel and collision fail-safe in isolated Chromium
        run: node tests/macro-ui-smoke.mjs
